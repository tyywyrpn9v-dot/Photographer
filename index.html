<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f3ed">
<title>iPhone 18 Pro 攝影參數指南</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="eyebrow">📷 iPHONE 18 PRO · CAMERA GUIDE</div>
  <h1>拍攝場景參數指南</h1>
  <p>選擇場景，即時查看建議參數、調校原因與注意事項。</p>
  <div class="search-wrap"><span>🔎</span><input id="search" placeholder="搜尋場景，例如：夜景、流水、人像…"></div>
</header>
<main>
  <section class="section-head"><div><h2>拍攝場景</h2><p id="count"></p></div></section>
  <section id="sceneGrid" class="scene-grid"></section>
</main>
<div id="modal" class="modal hidden">
  <div class="backdrop" data-close></div>
  <article class="modal-card">
    <button class="close" data-close aria-label="關閉">×</button>
    <div id="detail"></div>
  </article>
</div>
<footer>iPhone 18 Pro Camera Guide · GitHub Pages Ready</footer>
<script src="app.js"></script>
</body>
</html>
